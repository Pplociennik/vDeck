# vDeck start settings, read by the launcher at every start.
# panel.address: 127.0.0.1 keeps the panel reachable from this computer only. Use the LAN address
# of this computer or 0.0.0.0 only on a trusted network: the panel serves plain HTTP.
panel.address=127.0.0.1
# panel.port: HTTP port of the panel; change it if 8085 is already in use.
panel.port=8085
# update.enabled: true checks GitHub for a newer vDeck at start and installs it; false never does.
update.enabled=true
