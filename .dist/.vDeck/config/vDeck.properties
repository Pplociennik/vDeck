# Settings of the vDeck panel itself. All paths are relative to the Valheim server installation.
# The panel reads this file at start, so changes made by hand take effect after a restart of
# the panel. Settings changed in the panel are saved here at once; comments and layout are kept.

# ==================================================================================================
# Game server
# ==================================================================================================

# Name of the start script shipped with the Valheim dedicated server, in the installation
# directory. vDeck only reads it to pick up the environment it sets and never changes it.
server.start.script=start_headless_server.bat

# Whether vDeck refuses to start in a directory without valheim_server.exe.
# - true: vDeck prints a message and exits when valheim_server.exe is missing.
# - false: vDeck starts anyway, e.g. in a test directory without the game server.
# Any other value counts as true.
server.file.check=true

# ==================================================================================================
# Game server logs
# ==================================================================================================

# Directory receiving the game server logs. Every start writes its own log file into a
# directory named after the day, so a restart never overwrites the log of the previous run.
game.log.directory=.vDeck/log

# Whether old game server logs are removed.
# - true: logs older than game.log.retention.days are removed before every start.
# - false: every log is kept and game.log.retention.days is ignored.
game.log.retention.enabled=true

# How many days of game server logs are kept while game.log.retention.enabled is true.
# 0 keeps every log. A negative value or one that is not a number counts as 14.
game.log.retention.days=14

# ==================================================================================================
# World snapshots
# ==================================================================================================

# Name of the directory holding the copies of the world taken before the server is stopped.
# A single directory name, not a path: the directory is created inside the .vDeck directory.
snapshot.directory=shutdown-snapshots

# ==================================================================================================
# Panel
# ==================================================================================================

# Whether the panel opens its address in the default web browser after it has started.
# - true: the browser opens the panel when vDeck is started with start-vDeck.bat.
# - false: nothing is opened; open the panel address yourself.
# Any other value counts as true.
panel.open.browser=true

# What happens to the running Valheim server when the panel is closed.
# - stop: the server is stopped gracefully, with a world snapshot first; when that fails,
#   the server process is forced to exit.
# - graceful: the server is stopped gracefully; when that fails, the process keeps running.
# - leave: the server keeps running; the next start of the panel can take it over.
# Any other value counts as stop.
panel.close.strategy=stop

# Whether the "Ustawienia gry" screen shows its advanced section. The panel saves this
# value every time the section is shown or hidden.
# - true: the advanced section is shown.
# - false: the advanced section is hidden.
panel.game.settings.advanced=false

# ==================================================================================================
# Panel logs
# ==================================================================================================

# Whether old panel logs in .vDeck/logs/panel are removed.
# - true: logs older than panel.log.retention.days are removed after the panel has started.
# - false: every log is kept and panel.log.retention.days is ignored.
panel.log.retention.enabled=true

# How many days of panel logs are kept while panel.log.retention.enabled is true.
# 0 keeps every log. A negative value or one that is not a number counts as 30.
panel.log.retention.days=30
