# Valheim launch profile: the options vDeck passes to valheim_server.exe at every start.
# Edit these settings in the panel, which validates them; the panel reads changes made by hand
# after a restart of the panel. Changes take effect at the next start of the Valheim server.
# Configure the server password through the panel before starting a public server.

# ==================================================================================================
# Server
# ==================================================================================================

# Server name shown in the server list (-name), at most 64 characters, without quotes.
server.name=vDeck

# Port of the server (-port), from 1024 to 65534. The server uses this port and the next one;
# without crossplay both have to be forwarded on the router.
server.port=2456

# Password players have to enter (-password). Set it in the panel, which never shows it.
# - empty: no password; allowed only when server.public is false.
# - otherwise: 5 to 64 characters without quotes, not starting or ending with a space.
server.password=

# Whether the server is listed in the in-game server browser (-public).
# - true: the server is visible in the server list.
# - false: players join only through "Join IP", e.g. in the local network.
server.public=true

# Which network backend the server runs on (-crossplay).
# - true: crossplay backend (PlayFab); players from every platform can join, no port
#   forwarding is needed, but joining through a local IP address is not possible.
# - false: Steam backend; only Steam players can join.
server.crossplay=false

# Identifier needed only when several crossplay servers run on this computer and port
# (-instanceid); each of them needs its own value to get its own PlayFab ID.
# - empty: the option is not passed.
# - otherwise: up to 32 letters, digits, hyphens or underscores.
server.instance.id=

# ==================================================================================================
# World and saves
# ==================================================================================================

# Name of the world the server creates or loads (-world), at most 64 letters, digits, spaces,
# hyphens or underscores, not starting or ending with a space.
server.world=Dedicated

# Directory of the worlds and of the player lists adminlist.txt, bannedlist.txt and
# permittedlist.txt (-savedir). A relative path inside the installation directory, other than
# the installation directory itself.
server.save.directory=valheim-data

# Interval between automatic world saves (-saveinterval), in seconds, from 60 to 86400.
server.save.interval=1800

# ==================================================================================================
# Automatic backups
# ==================================================================================================

# Number of automatic world backups kept by the server (-backups), from 1 to 100.
server.backup.count=4

# Time before the first automatic backup (-backupshort), in seconds, from 60 to 604800.
server.backup.short=7200

# Time between the subsequent automatic backups (-backuplong), in seconds, from 60 to 2592000.
server.backup.long=43200

# ==================================================================================================
# World modifiers
# ==================================================================================================

# Ready set of world modifiers (-preset). It replaces every earlier modifier; the modifiers
# and keys below are applied after it.
# - empty: no preset; the game's defaults changed only by the settings below.
# - normal: standard gameplay, every setting has the game's default value.
# - casual: very easy combat, mild death penalty, more resources, no raids, portals carry
#   every item, enemies do not attack first and raids depend on the player's progress.
# - easy: easy combat and fewer raids.
# - hard: hard combat and more raids.
# - hardcore: very hard combat, hardcore death penalty, more raids, restricted portals and
#   no map.
# - immersive: no portals and no map, and fire can spread across the whole world.
# - hammer: building costs no resources, enemies do not attack first and there are no raids.
world.preset=

# Strength of the enemies (-modifier combat).
# - empty: the game's default.
# - veryeasy, easy, hard, veryhard: from the weakest to the strongest enemies.
world.modifier.combat=

# What a player loses after death (-modifier deathpenalty).
# - empty: the game's default.
# - casual, veryeasy, easy, hard, hardcore: from the mildest to the harshest penalty.
world.modifier.death.penalty=

# Amount of resources gathered from the world and from enemies (-modifier resources).
# - empty: the game's default.
# - muchless, less, more, muchmore, most: from the fewest to the most resources.
world.modifier.resources=

# Frequency of raids on the players' bases (-modifier raids).
# - empty: the game's default.
# - none: no raids at all.
# - muchless, less, more, muchmore: from the rarest to the most frequent raids.
world.modifier.raids=

# Restrictions on carrying items through portals (-modifier portals).
# - empty: the game's default.
# - casual: portals carry every item.
# - hard, veryhard: stricter restrictions than the game's default.
world.modifier.portals=

# ==================================================================================================
# World keys
# ==================================================================================================

# Building costs no resources (-setkey nobuildcost).
# - true: the key is set.
# - false: building costs resources as usual.
world.key.no.build.cost=false

# Raids depend on the progress of the individual players (-setkey playerevents).
# - true: the key is set.
# - false: raids depend on the progress of the whole world.
world.key.player.events=false

# Enemies do not attack first (-setkey passivemobs).
# - true: the key is set.
# - false: enemies attack as usual.
world.key.passive.mobs=false

# The map and the minimap are disabled (-setkey nomap).
# - true: the key is set.
# - false: the map works as usual.
world.key.no.map=false
