spring:
  application:
    name: vdeck
  datasource:
    url: jdbc:sqlite:vdeck.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
  messages:
    use-code-as-default-message: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  port: 8085
