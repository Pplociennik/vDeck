spring:
  application:
    name: vdeck
  datasource:
    url: jdbc:sqlite:vdeck.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
