# -----------------------------------------------------------------------------------------------------
# Profil uruchomieniowy - pola i ich opisy
#
# Opis kazdego pola podaje opcje wiersza polecen, jej znaczenie, dozwolone albo mozliwe wartosci oraz
# wartosc domyslna. Zakresy musza odpowiadac walidacji w ServerSettingsForm i GameSettingsForm. Opis
# listy rozwijanej nie wymienia mozliwych wartosci - pokazuje je sama lista - ani wartosci domyslnej,
# gdy lista oznacza ja jako domyslna. Opis pola wyboru (checkbox) nie podaje wartosci ani wartosci
# domyslnej - mowi tylko, co oznacza zaznaczenie.
# -----------------------------------------------------------------------------------------------------
launchProfile.field.serverName=Nazwa serwera
launchProfile.hint.serverName=Opcja -name. Nazwa widoczna na li\u015bcie serwer\u00f3w. Dozwolone: od 1 do 64 znak\u00f3w, bez cudzys\u0142owu (") i znak\u00f3w steruj\u0105cych. Domy\u015blnie: vDeck.
launchProfile.field.port=Port
launchProfile.hint.port=Opcja -port. Serwer u\u017cywa podanego portu i portu o jeden wy\u017cszego; bez crossplay oba musz\u0105 by\u0107 przekierowane na routerze. Dozwolone: liczba od 1024 do 65534. Domy\u015blnie: 2456 (porty 2456\u20132457).
launchProfile.field.publicServer=Serwer publiczny
launchProfile.hint.publicServer=Opcja -public. Serwer jest widoczny na li\u015bcie serwer\u00f3w; bez tej opcji mo\u017cna do niego do\u0142\u0105czy\u0107 tylko przez \u201eDo\u0142\u0105cz przez IP\u201d, np. w sieci lokalnej.
launchProfile.field.crossplay=Crossplay
launchProfile.hint.crossplay=Opcja -crossplay. Serwer korzysta z zaplecza crossplay (PlayFab): do\u0142\u0105czy\u0107 mog\u0105 gracze z ka\u017cdej platformy, przekierowanie port\u00f3w nie jest potrzebne, ale nie mo\u017cna po\u0142\u0105czy\u0107 si\u0119 przez lokalny adres IP. Bez tej opcji serwer dzia\u0142a na zapleczu Steam i do\u0142\u0105czaj\u0105 do niego tylko gracze Steam.
launchProfile.field.instanceId=Identyfikator instancji
launchProfile.hint.instanceId=Opcja -instanceid. Potrzebny tylko wtedy, gdy na tym samym komputerze i porcie dzia\u0142a kilka serwer\u00f3w crossplay \u2013 ka\u017cdy musi mie\u0107 inny, aby otrzyma\u0142 w\u0142asne ID PlayFab. Dozwolone: puste (opcja nie jest przekazywana) albo do 32 liter \u0142aci\u0144skich, cyfr oraz znak\u00f3w _ i -. Domy\u015blnie: puste.
launchProfile.field.password=Has\u0142o serwera
launchProfile.password.set=Has\u0142o jest ustawione.
launchProfile.password.notSet=Has\u0142o nie jest ustawione.
launchProfile.hint.password=Opcja -password. Has\u0142o podawane przez graczy przy do\u0142\u0105czaniu. Pozostaw pole puste, aby zachowa\u0107 obecne has\u0142o. Dozwolone: od 5 do 64 znak\u00f3w, bez cudzys\u0142owu (") i bez spacji na pocz\u0105tku i ko\u0144cu; has\u0142o nie mo\u017ce by\u0107 fragmentem nazwy serwera. Has\u0142o jest przechowywane w pliku konfiguracji jawnym tekstem i nigdy nie jest wy\u015bwietlane.
launchProfile.field.clearPassword=Usu\u0144 has\u0142o
launchProfile.hint.clearPassword=Usuwa zapisane has\u0142o; serwer uruchomi si\u0119 bez opcji -password.
launchProfile.field.worldName=Nazwa \u015bwiata
launchProfile.hint.worldName=Opcja -world. \u015awiat o tej nazwie zostanie utworzony albo, je\u015bli istnieje ju\u017c w katalogu zapisu, wczytany. Dozwolone: od 1 do 64 liter \u0142aci\u0144skich, cyfr, spacji oraz znak\u00f3w _ i -, bez spacji na pocz\u0105tku i ko\u0144cu. Domy\u015blnie: Dedicated.
launchProfile.field.saveDirectory=Katalog zapisu
launchProfile.hint.saveDirectory=Opcja -savedir. Katalog \u015bwiat\u00f3w oraz plik\u00f3w adminlist.txt, bannedlist.txt i permittedlist.txt. Dozwolone: \u015bcie\u017cka wzgl\u0119dna wewn\u0105trz katalogu instalacji, inna ni\u017c sam katalog instalacji; \u015bcie\u017cki bezwzgl\u0119dne i wychodz\u0105ce poza instalacj\u0119 s\u0105 odrzucane. Domy\u015blnie: valheim-data.
launchProfile.field.saveInterval=Interwa\u0142 zapisu \u015bwiata (s)
launchProfile.hint.saveInterval=Opcja -saveinterval. Co ile sekund serwer zapisuje \u015bwiat. Dozwolone: od 60 do 86400 sekund (od 1 minuty do 24 godzin). Domy\u015blnie: 1800 (30 minut).
launchProfile.field.logFile=Plik logu serwera
launchProfile.hint.logFile=Opcja -logFile nie jest ustawiana tutaj: panel sam kieruje log ka\u017cdego uruchomienia do osobnego pliku w katalogu dnia, wewn\u0105trz katalogu wskazanego przez ustawienie game.log.directory w pliku vDeck.properties.
launchProfile.hint.backups=Serwer sam tworzy kopie \u015bwiata: pierwsz\u0105, kr\u00f3tk\u0105, po up\u0142ywie interwa\u0142u pierwszej kopii, a kolejne, d\u0142ugie, co interwa\u0142 kolejnych kopii. Domy\u015blnie oznacza to jedn\u0105 kopi\u0119 sprzed 2 godzin i trzy kopie w odst\u0119pach 12 godzin.
launchProfile.field.backupCount=Liczba kopii
launchProfile.hint.backupCount=Opcja -backups. Ile automatycznych kopii przechowuje serwer; pierwsza jest kopi\u0105 kr\u00f3tk\u0105, pozosta\u0142e d\u0142ugimi. Dozwolone: od 1 do 100. Domy\u015blnie: 4.
launchProfile.field.backupShort=Interwa\u0142 pierwszej kopii (s)
launchProfile.hint.backupShort=Opcja -backupshort. Odst\u0119p przed pierwsz\u0105 automatyczn\u0105 kopi\u0105. Dozwolone: od 60 do 604800 sekund (od 1 minuty do 7 dni). Domy\u015blnie: 7200 (2 godziny).
launchProfile.field.backupLong=Interwa\u0142 kolejnych kopii (s)
launchProfile.hint.backupLong=Opcja -backuplong. Odst\u0119p mi\u0119dzy kolejnymi automatycznymi kopiami. Dozwolone: od 60 do 2592000 sekund (od 1 minuty do 30 dni). Domy\u015blnie: 43200 (12 godzin).
launchProfile.field.preset=Zestaw ustawie\u0144 \u015bwiata
launchProfile.hint.preset=Opcja -preset. Gotowy zestaw modyfikator\u00f3w; zast\u0119puje wszystkie wcze\u015bniejsze modyfikatory, a modyfikatory wybrane poni\u017cej s\u0105 stosowane po nim. Domy\u015blnie: brak.
launchProfile.field.modifier.combat=Walka
launchProfile.hint.modifier.combat=Opcja -modifier combat. Si\u0142a przeciwnik\u00f3w.
launchProfile.field.modifier.deathPenalty=Kara za \u015bmier\u0107
launchProfile.hint.modifier.deathPenalty=Opcja -modifier deathpenalty. Co gracz traci po \u015bmierci.
launchProfile.field.modifier.resources=Zasoby
launchProfile.hint.modifier.resources=Opcja -modifier resources. Ilo\u015b\u0107 surowc\u00f3w zdobywanych ze \u015bwiata i z przeciwnik\u00f3w.
launchProfile.field.modifier.raids=Najazdy
launchProfile.hint.modifier.raids=Opcja -modifier raids. Cz\u0119stotliwo\u015b\u0107 najazd\u00f3w na bazy graczy.
launchProfile.field.modifier.portals=Portale
launchProfile.hint.modifier.portals=Opcja -modifier portals. Ograniczenia przenoszenia przedmiot\u00f3w przez portale.
launchProfile.field.key.noBuildCost=Budowanie bez koszt\u00f3w
launchProfile.hint.key.noBuildCost=Opcja -setkey nobuildcost. Budowanie nie zu\u017cywa surowc\u00f3w.
launchProfile.field.key.playerEvents=Najazdy zale\u017cne od gracza
launchProfile.hint.key.playerEvents=Opcja -setkey playerevents. Najazdy zale\u017c\u0105 od post\u0119p\u00f3w poszczeg\u00f3lnych graczy, a nie ca\u0142ego \u015bwiata.
launchProfile.field.key.passiveMobs=Pasywni przeciwnicy
launchProfile.hint.key.passiveMobs=Opcja -setkey passivemobs. Przeciwnicy nie atakuj\u0105 pierwsi.
launchProfile.field.key.noMap=Bez mapy
launchProfile.hint.key.noMap=Opcja -setkey nomap. Mapa i minimapa s\u0105 wy\u0142\u0105czone.


