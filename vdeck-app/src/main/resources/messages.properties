# =====================================================================================================
# vDeck - polski zestaw tekstow interfejsu.
#
# Plik jest czescia aplikacji i jest czytany z classpath przez standardowy MessageSource Spring Boota.
# Panel ma jeden jezyk, wiec nie istnieje kopia zewnetrzna ani plik dla innego jezyka.
#
# Plik jest czysto ASCII: polskie znaki zapisujemy sekwencjami \uXXXX (patrz .docs/rules/formating.md
# rozdzial 1), wiec jego tresc nie zalezy od kodowania uzytego przez edytor lub narzedzie.
#
# Klucze sa pogrupowane wedlug ekranu albo komponentu interfejsu, ktorego dotycza. Nowy klucz trafia
# do istniejacej grupy; nowa grupa dostaje wlasny naglowek w tym samym formacie.
# =====================================================================================================


# -----------------------------------------------------------------------------------------------------
# Strona glowna panelu
# -----------------------------------------------------------------------------------------------------
home.title=vDeck


# -----------------------------------------------------------------------------------------------------
# Wyspa akcji - nazwy grup przyciskow czytane przez technologie asystujace
# -----------------------------------------------------------------------------------------------------
island.group.serverControl=Sterowanie serwerem
island.group.backups=Kopie bezpiecze\u0144stwa
island.group.panelManagement=Zarz\u0105dzanie panelem


# -----------------------------------------------------------------------------------------------------
# Wyspa akcji - nazwy poszczegolnych akcji, uzywane jako etykieta i podpowiedz przycisku
# -----------------------------------------------------------------------------------------------------
island.action.start=Uruchom serwer
island.action.stop=Zatrzymaj serwer
island.action.restart=Uruchom serwer ponownie
island.action.forceStop=Wymu\u015b zatrzymanie serwera
island.action.worldBackup=Utw\u00f3rz kopi\u0119 \u015bwiata
island.action.serverBackup=Utw\u00f3rz kopi\u0119 serwera
island.action.changePassword=Zmie\u0144 has\u0142o
island.action.logout=Wyloguj si\u0119


# -----------------------------------------------------------------------------------------------------
# Ekran zmiany hasla uruchamiany z wyspy akcji - tresc strony
# -----------------------------------------------------------------------------------------------------
changePassword.title=Zmiana has\u0142a \u00b7 vDeck
changePassword.heading=Zmie\u0144 has\u0142o
changePassword.lead=Podaj aktualne has\u0142o i ustaw nowe. Po zapisaniu zmiany nast\u0105pi wylogowanie z panelu.


# -----------------------------------------------------------------------------------------------------
# Ekran wymuszonej zmiany hasla poczatkowego - tresc strony
#
# Ekran nie pyta o aktualne haslo, bo konto uzywa opublikowanego hasla domyslnego, ktorego uzytkownik
# nigdy nie wybieral.
# -----------------------------------------------------------------------------------------------------
changePassword.initial.title=Pierwsze logowanie \u00b7 vDeck
changePassword.initial.heading=Ustaw w\u0142asne has\u0142o
changePassword.initial.lead=Pocz\u0105tkowe has\u0142o administratora musi zosta\u0107 zmienione przed rozpocz\u0119ciem pracy z panelem.


# -----------------------------------------------------------------------------------------------------
# Zmiana hasla - formularz wspolny dla obu ekranow
# -----------------------------------------------------------------------------------------------------
changePassword.field.currentPassword=Aktualne has\u0142o
changePassword.field.newPassword=Nowe has\u0142o
changePassword.field.confirmation=Powt\u00f3rz nowe has\u0142o
changePassword.action.submit=Zmie\u0144 has\u0142o


# -----------------------------------------------------------------------------------------------------
# Zmiana hasla - wymagania dla nowego hasla, komponent common/password-rules
#
# Lista musi opisywac reguly faktycznie egzekwowane przez serwer: dlugosc z obu rekordow zadania oraz
# kontrole z PanelUserService. Obowiazuje tak samo na ekranie wymuszonym i na uruchamianym z wyspy.
# -----------------------------------------------------------------------------------------------------
changePassword.requirements.heading=Wymagania dla nowego has\u0142a
changePassword.requirements.length=Od 12 do 128 znak\u00f3w.
changePassword.requirements.digit=Co najmniej jedna cyfra.
changePassword.requirements.lowerCase=Co najmniej jedna ma\u0142a litera.
changePassword.requirements.upperCase=Co najmniej jedna wielka litera.
changePassword.requirements.special=Co najmniej jeden znak specjalny.
changePassword.requirements.differentFromCurrent=Musi r\u00f3\u017cni\u0107 si\u0119 od aktualnego has\u0142a.
changePassword.requirements.confirmation=Musi by\u0107 identyczne w obu polach.


# -----------------------------------------------------------------------------------------------------
# Zmiana hasla - komunikaty bledow wspolne dla obu ekranow
#
# Komunikaty nie moga zdradzac wiecej niz wymaga tego obsluga bledu przez uzytkownika. Ekran wymuszonej
# zmiany nie uzywa komunikatu currentPasswordIncorrect, bo nie pyta o aktualne haslo.
# -----------------------------------------------------------------------------------------------------
changePassword.error.invalidInput=Wszystkie pola s\u0105 wymagane, a nowe has\u0142o musi mie\u0107 od 12 do 128 znak\u00f3w.
changePassword.error.currentPasswordIncorrect=Aktualne has\u0142o jest niepoprawne.
changePassword.error.newPasswordMismatch=Nowe has\u0142o i jego powt\u00f3rzenie r\u00f3\u017cni\u0105 si\u0119.
changePassword.error.newPasswordUnchanged=Nowe has\u0142o musi r\u00f3\u017cni\u0107 si\u0119 od aktualnego.
changePassword.error.newPasswordTooWeak=Nowe has\u0142o musi zawiera\u0107 cyfr\u0119, ma\u0142\u0105 liter\u0119, wielk\u0105 liter\u0119 i znak specjalny.
