server.error.confirmationRequired=Kill wymaga zaznaczenia zgody na ryzyko utraty post\u0119pu.
server.error.stopFailed=Nie uda\u0142o si\u0119 rozpocz\u0105\u0107 zatrzymania. Szczeg\u00f3\u0142y zapisano w logu panelu.
server.kill.title=Potwierdzenie wymuszonego zatrzymania
server.kill.risk=Panel spr\u00f3buje wykona\u0107 kopi\u0119 \u015bwiata i nast\u0119pnie od razu si\u0142owo zako\u0144czy proces, tak\u017ce gdy kopia nie powstanie. Kill mo\u017ce spowodowa\u0107 utrat\u0119 danych \u015bwiata. Kopia dzia\u0142aj\u0105cego \u015bwiata mo\u017ce by\u0107 niesp\u00f3jna; niezapisany post\u0119p mo\u017ce zosta\u0107 utracony.
server.kill.confirm=Akceptuj\u0119 ryzyko utraty post\u0119pu dla tego uruchomienia.
server.kill.submit=Potwierd\u017a Kill
server.kill.cancel=Anuluj
server.recovery.required=Wykryto serwer pozostawiony po zamkni\u0119ciu panelu lub uruchomiony poza panelem. Nowy start jest zablokowany. Mo\u017cesz przej\u0105\u0107 zweryfikowane uruchomienie zapisane przez panel; pozosta\u0142e procesy wymagaj\u0105 sprawdzenia poza panelem.
server.recovery.adopt=Przejmij zarz\u0105dzanie serwerem
server.stopFailure.SNAPSHOT=Nie utworzono kompletnej kopii \u015bwiata. Serwer pozostaje uruchomiony. Sprawd\u017a pliki \u015bwiata, miejsce i limit historii kopii. Potwierdzony Kill zako\u0144czy proces r\u00f3wnie\u017c bez backupu.
server.stopFailure.IDENTITY=Nie potwierdzono to\u017csamo\u015bci procesu lub helper nie wys\u0142a\u0142 sygna\u0142u. Serwer nie zosta\u0142 wymuszanie zako\u0144czony.
server.stopFailure.GRACEFUL=\u0141agodne zatrzymanie nie powiod\u0142o si\u0119. Serwer pozostaje uruchomiony. Mo\u017cesz ponowi\u0107 Stop lub osobno potwierdzi\u0107 Kill.
server.stopFailure.DEADLINE=Up\u0142yn\u0105\u0142 czas zatrzymania. Nie potwierdzono wyj\u015bcia serwera; proces pozostaje zarz\u0105dzany.
server.stopFailure.FORCE=Nie potwierdzono wyj\u015bcia po r\u0119cznie zatwierdzonym Kill. Proces pozostaje zarz\u0105dzany.
server.stopFailure.WORLD_SAVE_MISSING=Brakuje wymaganych plik\u00f3w zapisu \u015bwiata (.db/.fwl) lub katalogu worlds_local. Stop pozostawia serwer uruchomiony. Potwierdzony Kill zako\u0144czy proces r\u00f3wnie\u017c bez backupu.
