<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password · vDeck</title>
</head>
<body>
<!-- Mandatory password replacement for an authenticated account still using its initial credentials. -->
<main>
    <h1>Change your password</h1>
    <p>The initial administrator password must be replaced before using vDeck.</p>
    <p th:if="${passwordChangeError}" th:text="${passwordChangeError}" role="alert"></p>

    <form method="post" th:action="@{/change-password}" th:object="${passwordChangeRequest}">
        <div>
            <label for="current-password">Current password</label>
            <input id="current-password" name="currentPassword" type="password"
                   autocomplete="current-password" required>
        </div>
        <div>
            <label for="new-password">New password</label>
            <input id="new-password" name="newPassword" type="password"
                   autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <div>
            <label for="password-confirmation">Confirm new password</label>
            <input id="password-confirmation" name="confirmation" type="password"
                   autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <button type="submit">Change password</button>
    </form>
</main>
</body>
</html>
