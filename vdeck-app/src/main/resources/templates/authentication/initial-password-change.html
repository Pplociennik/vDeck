<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{changePassword.initial.title}">Pierwsze logowanie · vDeck</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/authentication.css}">
</head>
<body>
<!--
    Mandatory password replacement for an account still using its initial credentials. The screen
    deliberately carries no island and no other action: until the password is replaced, changing it is
    the only thing the account may do. The current password is not asked for - it is the published
    default the account has never chosen.
-->
<main class="page-center">
    <div class="surface auth-card">
        <div class="auth-header">
            <svg class="icon icon--large" aria-hidden="true" focusable="false">
                <use th:href="@{/icons/icons.svg#icon-key}"></use>
            </svg>
            <h1 class="auth-title" th:text="#{changePassword.initial.heading}">Ustaw własne hasło</h1>
        </div>
        <p class="auth-lead" th:text="#{changePassword.initial.lead}"></p>
        <p class="auth-alert" role="alert"
           th:if="${passwordChangeErrorKey}" th:text="#{${passwordChangeErrorKey}}"></p>

        <form class="auth-form" method="post" th:action="@{/initial-password-change}"
              th:object="${initialPasswordChangeRequest}">
            <div class="form-field">
                <label class="form-label" for="new-password" th:text="#{changePassword.field.newPassword}"></label>
                <input class="form-input" id="new-password" name="newPassword" type="password"
                       autocomplete="new-password" minlength="12" maxlength="128" required
                       aria-describedby="password-rules">
            </div>
            <div class="form-field">
                <label class="form-label" for="password-confirmation"
                       th:text="#{changePassword.field.confirmation}"></label>
                <input class="form-input" id="password-confirmation" name="confirmation" type="password"
                       autocomplete="new-password" minlength="12" maxlength="128" required>
            </div>

            <div th:replace="~{common/password-rules :: passwordRules}"></div>

            <button class="form-submit" type="submit" th:text="#{changePassword.action.submit}"></button>
        </form>
    </div>
</main>
</body>
</html>
