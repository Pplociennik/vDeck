<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Island component</title>
</head>
<body>
<!--
    Reusable action island of the panel: a single header strip grouping server control, backup and
    panel management actions, together with the tab above it showing the server's name and the
    diamond below it showing the server's state. Embedded by every
    view that needs the panel actions; the file is a Thymeleaf fragment and is never rendered as a
    standalone page.

    Every control carries the same text as its accessible name and as its tooltip, so a pointer user
    and a screen reader user get the same wording from the translation file.
-->
<header class="island-header" th:fragment="island" data-server-island th:attr="data-status-url=@{/server/status}">
    <!--
        The island, the name tab and the status diamond are one component. The tabs are siblings
        rather than children because the island clips its own overflow, and the wrapper reserves the
        height each tab sticks out above or below it.
    -->
    <div class="island-stack">
        <!-- Name trapezoid: the server name from the launch profile, rising from behind the island's
             upper edge. The title shows the whole name when a long one is cut. -->
        <span class="island-name" th:title="${serverName}">
            <span class="island-name__label" th:text="${serverName}">vDeck</span>
        </span>
        <div class="island surface surface--island">
            <div class="island-section island-section--server-control" role="group"
                 th:attr="aria-label=#{island.group.serverControl}">
                <!-- Runtime state disables commands conflicting with active work or unresolved recovery.
                     Restart and both backup actions are not implemented yet, so they stay disabled. -->
                <form class="island-action-form" th:action="@{/server/start}" method="post">
                    <button class="action-button" type="submit"
                            th:disabled="${!serverStatus.state.startable}"
                            th:attr="aria-label=#{island.action.start},title=#{island.action.start}">
                        <svg class="icon" aria-hidden="true" focusable="false">
                            <use th:href="@{/icons/icons.svg#icon-play}"></use>
                        </svg>
                    </button>
                </form>
                <form class="island-action-form" th:action="@{/server/stop}" method="post">
                    <input type="hidden" name="launchId" th:value="${serverStatus.launchId}">
                    <button class="action-button" type="submit" th:disabled="${!serverStatus.state.stoppable}"
                            th:attr="aria-label=#{island.action.stop},title=#{island.action.stop}">
                        <svg class="icon" aria-hidden="true" focusable="false">
                            <use th:href="@{/icons/icons.svg#icon-stop}"></use>
                        </svg>
                    </button>
                </form>
                <button class="action-button" type="button" disabled
                        th:attr="aria-label=#{island.action.restart},title=#{island.action.restart}">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use th:href="@{/icons/icons.svg#icon-restart}"></use>
                    </svg>
                </button>
                <form class="island-action-form" th:action="@{/server/kill-confirmation}" method="get">
                    <input type="hidden" name="launchId" th:value="${serverStatus.launchId}">
                    <button class="action-button" type="submit" th:disabled="${!serverStatus.state.stoppable}"
                            th:attr="aria-label=#{island.action.forceStop},title=#{island.action.forceStop}">
                        <svg class="icon" aria-hidden="true" focusable="false">
                            <use th:href="@{/icons/icons.svg#icon-power}"></use>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="island-section island-section--backups" role="group"
                 th:attr="aria-label=#{island.group.backups}">
                <button class="action-button" type="button" disabled
                        th:attr="aria-label=#{island.action.worldBackup},title=#{island.action.worldBackup}">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use th:href="@{/icons/icons.svg#icon-world-backup}"></use>
                    </svg>
                </button>
                <button class="action-button" type="button" disabled
                        th:attr="aria-label=#{island.action.serverBackup},title=#{island.action.serverBackup}">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use th:href="@{/icons/icons.svg#icon-server-backup}"></use>
                    </svg>
                </button>
            </div>

            <div class="island-section island-section--panel-management" role="group"
                 th:attr="aria-label=#{island.group.panelManagement}">
                <a class="action-button" th:href="@{/change-password}"
                   th:attr="aria-label=#{island.action.changePassword},title=#{island.action.changePassword}">
                    <svg class="icon" aria-hidden="true" focusable="false">
                        <use th:href="@{/icons/icons.svg#icon-key}"></use>
                    </svg>
                </a>
                <form class="island-action-form" th:action="@{/logout}" method="post">
                    <button class="action-button" type="submit"
                            th:attr="aria-label=#{island.action.logout},title=#{island.action.logout}">
                        <svg class="icon" aria-hidden="true" focusable="false">
                            <use th:href="@{/icons/icons.svg#icon-logout}"></use>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <!-- Status trapezoid: a coloured dot and, beside it, the same state in words, so the state is
             never carried by colour alone. -->
        <span class="island-status"
              th:classappend="'is-' + ${#strings.replace( #strings.toLowerCase( serverStatus.state ), '_', '-' )}">
            <span class="island-status__indicator" aria-hidden="true"></span>
            <span class="island-status__label"
                  th:text="#{${'server.state.' + serverStatus.state}}">Zatrzymany</span>
        </span>
    </div>
    <p class="island-stop-message form-alert" role="alert" th:if="${serverStatus.stopFailure != null}"
       th:text="#{${'server.stopFailure.' + serverStatus.stopFailure}}"></p>
</header>
</body>
</html>
