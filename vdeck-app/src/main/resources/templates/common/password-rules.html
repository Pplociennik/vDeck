<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password rules component</title>
</head>
<body>
<!--
    Reusable list of the rules the server enforces on a new panel password. Embedded by every screen
    that sets a password; the file is a Thymeleaf fragment and is never rendered as a standalone page.

    The embedding view links its new-password field to this section through aria-describedby, so the
    identifier below is part of the fragment contract and must stay stable.
-->
<section class="password-rules" id="password-rules" th:fragment="passwordRules">
    <h2 class="password-rules-heading" th:text="#{changePassword.requirements.heading}"></h2>
    <ul class="password-rules-list">
        <li th:text="#{changePassword.requirements.length}"></li>
        <li th:text="#{changePassword.requirements.digit}"></li>
        <li th:text="#{changePassword.requirements.lowerCase}"></li>
        <li th:text="#{changePassword.requirements.upperCase}"></li>
        <li th:text="#{changePassword.requirements.special}"></li>
        <li th:text="#{changePassword.requirements.differentFromCurrent}"></li>
        <li th:text="#{changePassword.requirements.confirmation}"></li>
    </ul>
</section>
</body>
</html>
