<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Side menu component</title>
</head>
<body>
<!--
    Reusable side menu of the panel: a round toggle in the bottom-left corner and a navigation panel that
    rises above it. The toggle is set deep into the panel's bottom-left corner, which is cut out around
    it, so the open menu wraps the button with an arc-shaped gap edged by an accent ring.

    Entries are grouped into titled sections; inside a section they form a tree of up to three levels,
    where a branch expands its children in place and collapses its open siblings.

    Embedded by every view that offers navigation; the file is a Thymeleaf fragment and is never
    rendered as a standalone page. The panel starts closed and inert, and side-menu.js drives it. A view
    reached from the menu passes its entry id as activeEntry, for example
    ~{common/side-menu :: sideMenu(activeEntry='gameSettings')}, so the entry is marked as the current
    page; other views embed the fragment without it. The "Serwer" branch holds one entry per panel of the
    server settings, with ids serverSettings.server, serverSettings.access, serverSettings.world and
    serverSettings.backups.
-->
<div class="side-menu" th:fragment="sideMenu" data-side-menu>
    <button class="side-menu-toggle round-button" type="button" aria-expanded="false" aria-controls="side-menu-panel"
            data-side-menu-toggle
            th:attr="aria-label=#{sideMenu.action.toggle},title=#{sideMenu.action.toggle}">
        <svg class="icon icon--large" aria-hidden="true" focusable="false">
            <use th:href="@{/icons/icons.svg#icon-menu}"></use>
        </svg>
    </button>

    <nav id="side-menu-panel" class="side-menu-panel" data-state="closed" data-side-menu-panel inert
         th:attr="aria-label=#{sideMenu.label}">
        <div class="side-menu-surface surface surface--side-menu">
            <div class="side-menu-sections">
                <section class="side-menu-section" aria-labelledby="side-menu-section-title-configuration">
                    <h2 th:replace="~{common/side-menu :: sectionTitle('sideMenu.section.configuration', 'side-menu-section-title-configuration')}"></h2>
                    <ul class="side-menu-list side-menu-list--level-1">
                        <li class="side-menu-item">
                            <button th:replace="~{common/side-menu :: branchToggle('sideMenu.entry.serverSettings', 'icon-server', 'side-menu-children-server-settings')}"></button>
                            <div class="side-menu-children" id="side-menu-children-server-settings" inert>
                                <ul class="side-menu-list side-menu-list--level-2">
                                    <li class="side-menu-item">
                                        <a th:replace="~{common/side-menu :: link('sideMenu.entry.serverSettings.server', null, '/server-settings/server', 'serverSettings.server')}"></a>
                                    </li>
                                    <li class="side-menu-item">
                                        <a th:replace="~{common/side-menu :: link('sideMenu.entry.serverSettings.access', null, '/server-settings/access', 'serverSettings.access')}"></a>
                                    </li>
                                    <li class="side-menu-item">
                                        <a th:replace="~{common/side-menu :: link('sideMenu.entry.serverSettings.world', null, '/server-settings/world', 'serverSettings.world')}"></a>
                                    </li>
                                    <li class="side-menu-item">
                                        <a th:replace="~{common/side-menu :: link('sideMenu.entry.serverSettings.backups', null, '/server-settings/backups', 'serverSettings.backups')}"></a>
                                    </li>
                                </ul>
                            </div>
                        </li>
                        <li class="side-menu-item">
                            <a th:replace="~{common/side-menu :: link('sideMenu.entry.gameSettings', 'icon-sliders', '/game-settings', 'gameSettings')}"></a>
                        </li>
                    </ul>
                </section>

                <section class="side-menu-section" aria-labelledby="side-menu-section-title-processes">
                    <h2 th:replace="~{common/side-menu :: sectionTitle('sideMenu.section.processes', 'side-menu-section-title-processes')}"></h2>
                    <ul class="side-menu-list side-menu-list--level-1">
                        <li class="side-menu-item">
                            <a th:replace="~{common/side-menu :: link('sideMenu.entry.console', 'icon-console', '/console', 'console')}"></a>
                        </li>
                    </ul>
                </section>
            </div>
        </div>
        <span class="side-menu-notch-frame" aria-hidden="true"></span>
    </nav>

    <script type="module" th:src="@{/js/side-menu.js}"></script>
</div>

<!--
    Title of a menu section: muted text centred on a horizontal line. titleId labels the enclosing
    section element.
-->
<h2 class="side-menu-section__title" th:fragment="sectionTitle(labelKey, titleId)" th:id="${titleId}"
    th:text="#{${labelKey}}"></h2>

<!--
    Entry expanding a branch. It controls the children wrapper that must directly follow it inside the
    same list item; iconId may be null for entries below the first level.
-->
<button class="side-menu-entry side-menu-entry--branch" type="button" aria-expanded="false"
        th:fragment="branchToggle(labelKey, iconId, childrenId)"
        th:attr="aria-controls=${childrenId}" data-side-menu-branch>
    <svg class="icon" th:if="${iconId}" aria-hidden="true" focusable="false">
        <use th:href="@{'/icons/icons.svg#' + ${iconId}}"></use>
    </svg>
    <span class="side-menu-entry__label" th:text="#{${labelKey}}"></span>
    <svg class="icon side-menu-entry__chevron" aria-hidden="true" focusable="false">
        <use th:href="@{/icons/icons.svg#icon-chevron}"></use>
    </svg>
</button>

<!--
    Entry opening a panel. entryId identifies it: when it equals the activeEntry passed by the embedding
    view, the entry is marked as the current page.
-->
<a class="side-menu-entry" th:fragment="link(labelKey, iconId, href, entryId)" th:href="@{${href}}"
   th:aria-current="${activeEntry == entryId} ? 'page'">
    <svg class="icon" th:if="${iconId}" aria-hidden="true" focusable="false">
        <use th:href="@{'/icons/icons.svg#' + ${iconId}}"></use>
    </svg>
    <span class="side-menu-entry__label" th:text="#{${labelKey}}"></span>
</a>
</body>
</html>
