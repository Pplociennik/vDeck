<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title}">vDeck</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>
<!--
    Panel home page. It shows the page background, the action island and the side menu only - the
    content area stays empty until there is a feature to present in it.
-->
<div th:replace="~{common/island :: island}"></div>

<main class="page-content">
    <!-- Outcome of the last server control action, flashed here by the server feature. -->
    <p class="form-success settings-message" role="status"
       th:if="${serverStarted}" th:text="#{server.started}"></p>
    <p class="form-alert settings-message" role="alert"
       th:if="${serverErrorKey}" th:text="#{${serverErrorKey}}"></p>
</main>

<div th:replace="~{common/home-button :: homeButton}"></div>
<div th:replace="~{common/side-menu :: sideMenu}"></div>
</body>
</html>
