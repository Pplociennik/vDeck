<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title}">vDeck</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <script type="module" th:src="@{/js/server-status.js}"></script>
</head>
<body>
<!--
    Panel home page presenting control outcomes and an explicit recovery decision below the header.
-->
<div th:replace="~{common/island :: island}"></div>

<main class="page-content">
    <!-- Outcome of the last server control action, flashed here by the server feature. -->
    <p class="form-success settings-message" role="status"
       th:if="${serverStarted}" th:text="#{server.started}"></p>
    <p class="form-alert settings-message" role="alert"
       th:if="${serverErrorKey}" th:text="#{${serverErrorKey}}"></p>
    <p class="form-success settings-message" role="status"
       th:if="${serverStopping}" th:text="#{server.stopping}"></p>
    <section th:if="${serverStatus.state.name() == 'RECOVERY_REQUIRED'}" class="settings-message">
        <p class="form-alert" th:text="#{server.recovery.required}"></p>
        <form th:if="${serverStatus.launchId != null}" th:action="@{/server/adopt}" method="post">
            <input type="hidden" name="launchId" th:value="${serverStatus.launchId}">
            <button class="form-submit" type="submit" th:text="#{server.recovery.adopt}"></button>
        </form>
    </section>
</main>

<div th:replace="~{common/home-button :: homeButton}"></div>
<div th:replace="~{common/side-menu :: sideMenu}"></div>
</body>
</html>
