<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Server settings panels</title>
</head>
<body>
<!--
    Fields of the panels of the "Serwer" branch, one fragment per panel, named like the panel. Embedded only
    by launch/server-settings, inside its form; the file is never rendered as a standalone page. Each
    fragment reads its own form from the model.
-->

<!-- "Serwer": name, port, visibility and crossplay backend of the server. -->
<div class="settings-fields" th:fragment="server" th:with="form=${serverIdentityForm}">
    <div class="form-field">
        <label class="form-label" for="server-name" th:text="#{launchProfile.field.serverName}"></label>
        <input class="form-input" id="server-name" name="serverName" type="text" maxlength="64"
               required aria-describedby="server-name-hint" th:value="${form.serverName()}">
        <p class="form-hint" id="server-name-hint" th:text="#{launchProfile.hint.serverName}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="port" th:text="#{launchProfile.field.port}"></label>
        <input class="form-input" id="port" name="port" type="number" inputmode="numeric"
               min="1024" max="65534" step="1" required aria-describedby="port-hint"
               th:value="${form.port()}">
        <p class="form-hint" id="port-hint" th:text="#{launchProfile.hint.port}"></p>
    </div>
    <div class="form-field">
        <label class="form-checkbox">
            <input type="checkbox" name="publicServer" value="true" aria-describedby="public-server-hint"
                   th:checked="${form.publicServer()}">
            <span th:text="#{launchProfile.field.publicServer}"></span>
        </label>
        <p class="form-hint" id="public-server-hint" th:text="#{launchProfile.hint.publicServer}"></p>
    </div>
    <div class="form-field">
        <label class="form-checkbox">
            <input type="checkbox" name="crossplay" value="true" aria-describedby="crossplay-hint"
                   th:checked="${form.crossplay()}">
            <span th:text="#{launchProfile.field.crossplay}"></span>
        </label>
        <p class="form-hint" id="crossplay-hint" th:text="#{launchProfile.hint.crossplay}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="instance-id" th:text="#{launchProfile.field.instanceId}"></label>
        <input class="form-input" id="instance-id" name="instanceId" type="text" maxlength="32"
               pattern="[A-Za-z0-9_\-]*" aria-describedby="instance-id-hint"
               th:value="${form.instanceId()}">
        <p class="form-hint" id="instance-id-hint" th:text="#{launchProfile.hint.instanceId}"></p>
    </div>
</div>

<!--
    "Dostęp": the server password. The stored password is never rendered - the panel only states whether
    one is set.
-->
<div class="settings-fields" th:fragment="access" th:with="form=${serverAccessForm}">
    <div class="form-field">
        <label class="form-label" for="server-password" th:text="#{launchProfile.field.password}"></label>
        <p class="form-status" id="server-password-status"
           th:text="${passwordSet} ? #{launchProfile.password.set} : #{launchProfile.password.notSet}"></p>
        <input class="form-input" id="server-password" name="password" type="password"
               autocomplete="new-password" minlength="5" maxlength="64"
               aria-describedby="server-password-status server-password-hint">
        <p class="form-hint" id="server-password-hint" th:text="#{launchProfile.hint.password}"></p>
    </div>
    <div class="form-field" th:if="${passwordSet}">
        <label class="form-checkbox">
            <input type="checkbox" name="clearPassword" value="true"
                   aria-describedby="clear-password-hint" th:checked="${form.clearPassword()}">
            <span th:text="#{launchProfile.field.clearPassword}"></span>
        </label>
        <p class="form-hint" id="clear-password-hint" th:text="#{launchProfile.hint.clearPassword}"></p>
    </div>
</div>

<!-- "Świat i zapis": the world, its save directory and the save interval. -->
<div class="settings-fields" th:fragment="world" th:with="form=${worldSaveForm}">
    <div class="form-field">
        <label class="form-label" for="world-name" th:text="#{launchProfile.field.worldName}"></label>
        <input class="form-input" id="world-name" name="worldName" type="text" maxlength="64"
               required aria-describedby="world-name-hint" th:value="${form.worldName()}">
        <p class="form-hint" id="world-name-hint" th:text="#{launchProfile.hint.worldName}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="save-directory" th:text="#{launchProfile.field.saveDirectory}"></label>
        <input class="form-input" id="save-directory" name="saveDirectory" type="text" maxlength="255"
               required aria-describedby="save-directory-hint" th:value="${form.saveDirectory()}">
        <p class="form-hint" id="save-directory-hint" th:text="#{launchProfile.hint.saveDirectory}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="save-interval" th:text="#{launchProfile.field.saveInterval}"></label>
        <input class="form-input" id="save-interval" name="saveInterval" type="number" inputmode="numeric"
               min="60" max="86400" step="1" required aria-describedby="save-interval-hint"
               th:value="${form.saveInterval()}">
        <p class="form-hint" id="save-interval-hint" th:text="#{launchProfile.hint.saveInterval}"></p>
    </div>
    <div class="form-field">
        <span class="form-label" th:text="#{launchProfile.field.logFile}"></span>
        <p class="form-hint" th:text="#{launchProfile.hint.logFile}"></p>
    </div>
</div>

<!-- "Kopie automatyczne": how many world backups the server keeps and how often it makes them. -->
<div class="settings-fields" th:fragment="innerServerBackups" th:with="form=${serverBackupsForm}">
    <div class="form-field">
        <label class="form-label" for="backup-count" th:text="#{launchProfile.field.backupCount}"></label>
        <input class="form-input" id="backup-count" name="backupCount" type="number" inputmode="numeric"
               min="1" max="100" step="1" required aria-describedby="backup-count-hint"
               th:value="${form.backupCount()}">
        <p class="form-hint" id="backup-count-hint" th:text="#{launchProfile.hint.backupCount}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="backup-short" th:text="#{launchProfile.field.backupShort}"></label>
        <input class="form-input" id="backup-short" name="backupShort" type="number" inputmode="numeric"
               min="60" max="604800" step="1" required aria-describedby="backup-short-hint"
               th:value="${form.backupShort()}">
        <p class="form-hint" id="backup-short-hint" th:text="#{launchProfile.hint.backupShort}"></p>
    </div>
    <div class="form-field">
        <label class="form-label" for="backup-long" th:text="#{launchProfile.field.backupLong}"></label>
        <input class="form-input" id="backup-long" name="backupLong" type="number" inputmode="numeric"
               min="60" max="2592000" step="1" required aria-describedby="backup-long-hint"
               th:value="${form.backupLong()}">
        <p class="form-hint" id="backup-long-hint" th:text="#{launchProfile.hint.backupLong}"></p>
    </div>
</div>
</body>
</html>
