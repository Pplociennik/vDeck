<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{${'serverSettings.' + panel + '.title'}}">Serwer · vDeck</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <script type="module" th:src="@{/js/server-status.js}"></script>
</head>
<body>
<!--
    One panel of the "Serwer" branch of the side menu. The controller names the panel - server, access,
    world or backups - and the view shows that panel's fields from launch/server-settings-panels, each
    field explained together with the values it accepts. Min, max and pattern attributes are conveniences;
    the server side validates every value again.
-->
<div th:replace="~{common/island :: island}"></div>

<main class="page-content">
    <div class="panel-frame">
        <div class="surface view-card view-card--wide">
            <div class="view-header">
                <svg class="icon icon--large" aria-hidden="true" focusable="false">
                    <use th:href="@{/icons/icons.svg#icon-server}"></use>
                </svg>
                <h1 class="view-title" th:text="#{${'launchProfile.section.' + panel}}">Serwer</h1>
            </div>
            <p class="view-lead" th:text="#{${'serverSettings.' + panel + '.lead'}}"></p>
            <p class="form-success settings-message" role="status" th:if="${param.saved != null and launchProfileErrorKey == null}"
               th:text="#{serverSettings.saved}"></p>
            <p class="form-alert settings-message" role="alert"
               th:if="${launchProfileErrorKey}" th:text="#{${launchProfileErrorKey}}"></p>

            <form class="form-stack settings-form" method="post" th:action="@{/server-settings/{panel}(panel=${panel})}">
                <div th:replace="~{launch/server-settings-panels :: __${panel}__}"></div>

                <div class="settings-footer">
                    <p class="form-hint" th:text="#{launchProfile.appliesOnStart}"></p>
                    <button class="form-submit" type="submit" th:text="#{launchProfile.action.submit}"></button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{common/home-button :: homeButton}"></div>
<div th:replace="~{common/side-menu :: sideMenu(activeEntry=${'serverSettings.' + panel})}"></div>
</body>
</html>
