# =====================================================================================================
# vDeck - polski zestaw tekstow konsoli launchera i aktualizatora.
#
# Plik jest czescia vdeck-runtime i jest czytany z classpath przez I18n. Tekst panelu WWW lezy osobno,
# w messages.properties modulu vdeck-app.
#
# Plik jest czysto ASCII: polskie znaki zapisujemy sekwencjami \uXXXX (patrz .docs/rules/formating.md
# rozdzial 1). Wzorce formatuje java.text.MessageFormat: liczby maja jawny format ({0,number,#}),
# a apostrof zapisujemy podwojnie ('').
#
# Klucze sa pogrupowane wedlug programu. Kazdy klucz odpowiada stalej enuma ConsoleMessage,
# LauncherMessage albo UpdaterMessage.
# =====================================================================================================


# -----------------------------------------------------------------------------------------------------
# Wspolne
# -----------------------------------------------------------------------------------------------------
console.pressEnter=Naci\u015bnij Enter, aby zamkn\u0105\u0107 okno.
console.installationDirectoryUnknown=Nie mo\u017cna ustali\u0107 katalogu instalacji vDeck.
console.panelAddress=Panel vDeck: http://{0}:{1,number,#}
console.keepWindowOpen=Pozostaw to okno otwarte podczas pracy panelu.


